<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema — RB Psicanálise</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      position: relative;
      overflow: hidden;
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border-top: 4px solid #846122;
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(300px circle at var(--mx, -200px) var(--my, -200px), rgba(176, 137, 63, 0.1), transparent 70%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .login-card:hover::before { opacity: 1; }
    .logo-wrap { text-align: center; margin-bottom: 20px; }
    .logo-wrap img { max-width: 210px; max-height: 70px; object-fit: contain; }
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      text-align: center;
      color: #0f172a;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .sub { text-align: center; font-size: 0.82rem; color: #64748b; margin-bottom: 22px; }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #475569;
      margin-bottom: 5px;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    input:focus { outline: none; border-color: #846122; box-shadow: 0 0 0 2px rgba(132,97,34,0.15); }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 7px;
      background: linear-gradient(135deg, #b0893f, #846122);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { opacity: 0.94; }
    .flash {
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 0.82rem;
      background: #fef2f2;
      color: #991b1b;
      border-left: 3px solid #ef4444;
    }
    .flash-info { background: #eff6ff; color: #1e40af; border-color: #3b82f6; }
    .flash-warning { background: #fffbeb; color: #92400e; border-color: #f59e0b; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-wrap">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="RB Psicanálise">
    </div>
    <h1>Acesso Restrito à Clínica</h1>
    <p class="sub">Prontuário, Agenda e Atendimento Psicanalítico</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seu@email.com.br" autofocus>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required placeholder="••••••••">
      </div>
      <button type="submit">Entrar no Sistema</button>
    </form>
  </div>
  <script>
    const card = document.querySelector('.login-card');
    if (card) {
      card.addEventListener('pointermove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    }
  </script>
</body>
</html>
