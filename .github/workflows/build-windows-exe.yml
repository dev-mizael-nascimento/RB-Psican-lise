name: Build Windows EXE (RB Psicanálise)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r RB_Psicanalise_Web/requirements.txt
          pip install pyinstaller

      - name: Compilar RB_Psicanalise.exe (Sem Console + Ícone)
        working-directory: RB_Psicanalise_Web
        run: |
          pyinstaller --noconfirm --onefile --noconsole `
            --name "RB_Psicanalise" `
            --icon "static/app_icon.ico" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            desktop_launcher.py

      - name: Publicar Artifact do Executável
        uses: actions/upload-artifact@v4
        with:
          name: RB_Psicanalise_Windows_EXE
          path: RB_Psicanalise_Web/dist/RB_Psicanalise.exe

      - name: Anexar .exe na Release (quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RB_Psicanalise_Web/dist/RB_Psicanalise.exe
          generate_release_notes: true
